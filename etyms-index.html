<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>etyms</title>
<meta name="description" content="A museum of words. Every word is an artifact; slide to travel back to where it began.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='.55' stop-color='%23f0dcb4'/%3E%3Cstop offset='1' stop-color='%23b58a5a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Georgia,serif' font-size='52' fill='url(%23g)'%3Ee%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://en.wiktionary.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=Noto+Serif&display=swap">
<style>
/* Layout: one lit vitrine on true black. The word is the exhibit; the light inside the case
   drifts and shifts from daylight (today) to sepia (the deep past) as you travel. */
:root {
  --black: #000000;
  --case: #060606;
  --hair: rgba(255, 255, 255, .09);
  --text: #f4f2ee;
  --muted: #9a968f;
  --faint: #5d5a55;
  --font-word: "Instrument Serif", "Noto Serif", Georgia, serif;
  --font-text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --c1: 196, 214, 255; --c2: 244, 228, 198; --a: .16;
  --x1: 50%; --y1: 0%; --x2: 40%; --y2: 0%; --x3: 60%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--black); }
body {
  margin: 0; min-height: 100vh; color: var(--text);
  font: 400 15px/1.6 var(--font-text); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; align-items: center;
  padding-block: clamp(26px, 6vh, 60px) 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid rgba(var(--c1), .8); outline-offset: 3px; }

/* ---------- masthead: the e, then the wordmark with its line beneath ---------- */
.mast { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; text-decoration: none; color: var(--text); }
.mark-e {
  width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; position: relative;
  background: radial-gradient(120% 120% at 30% 0%, #1c1a17, #050505 70%);
  border: 1px solid var(--hair);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 8px 24px rgba(0, 0, 0, .8);
}
.mark-e span {
  font: 600 40px/1 "Cormorant Garamond", "Cormorant", Garamond, Georgia, serif; margin-top: -7px;
  background: linear-gradient(135deg, #ffffff 15%, #f0dcb4 55%, #b58a5a 95%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.mast .words { display: flex; flex-direction: column; gap: 6px; }
.mast b {
  font: 600 36px/0.85 "Cormorant Garamond", "Cormorant", Garamond, Georgia, serif; letter-spacing: .01em;
  font-feature-settings: "kern" 1, "liga" 1;
  background: linear-gradient(180deg, #ffffff 30%, #e9dcc3 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(240, 220, 180, .14));
  padding-bottom: 2px;
}
.mast small { font: 400 10px/1 var(--font-mono); color: var(--muted); letter-spacing: .2em; text-transform: uppercase; padding-left: 2px; }

/* ---------- the foyer: a painting chosen for what's being written ---------- */
.foyer { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.foyer .now { font: 400 10.5px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.frame {
  position: relative; display: grid; place-items: center;
  width: min(560px, 100%); aspect-ratio: 404 / 296; height: auto;
}
.frame img {
  grid-area: 1 / 1; max-height: 100%; max-width: min(100%, 520px); object-fit: contain; display: block;
  border: 1px solid rgba(255, 255, 255, .08);
  box-shadow: 0 30px 60px rgba(0, 0, 0, .9), 0 0 0 6px rgba(255, 255, 255, .015);
  opacity: 0; transition: opacity .9s ease;
}
.frame img.shown, .frame svg.shown { opacity: 1; }
.frame svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; cursor: pointer; opacity: 0; transition: opacity .9s ease; }
.frame .wait { grid-area: 1 / 1; width: 60%; max-width: 300px; height: 80%; border: 1px solid var(--hair); background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.04) 50%, transparent 70%) 0 0 / 300% 100%; animation: sheen 1.6s linear infinite; }
@keyframes sheen { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.label-card { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; max-width: 52ch; min-height: 60px; }
.label-card .t { font: 500 14px/1.35 var(--font-text); }
.label-card .m { font: 400 12px/1.4 var(--font-mono); color: var(--muted); letter-spacing: .02em; }
.label-card .s { font: 400 10.5px/1.4 var(--font-mono); color: var(--faint); letter-spacing: .04em; }
.label-card .s a { color: var(--faint); text-underline-offset: 3px; }
.foyer .invite { font: 400 15px/1.55 var(--font-text); color: var(--muted); text-align: center; max-width: 42ch; margin: 0; }

.colophon {
  width: 100%; max-width: 800px; margin-top: 40px; padding: 26px 16px 8px;
  border-top: 1px solid var(--hair);
  font: 400 13.5px/1.6 var(--font-mono); letter-spacing: .1em; text-transform: lowercase; color: var(--muted); text-align: center;
}
.colophon a { color: var(--text); text-decoration: none; border-bottom: 1px solid rgba(var(--c1), .4); padding-bottom: 1px; transition: border-color .2s; }
.colophon a:hover { border-color: rgba(var(--c1), .9); }

/* ---------- the vitrine ---------- */
.case {
  position: relative; isolation: isolate; overflow: hidden;
  width: 100%; max-width: 800px;
  background: var(--case); border: 1px solid var(--hair); border-radius: 28px;
  padding: clamp(24px, 5vw, 44px) clamp(18px, 6vw, 60px) clamp(24px, 4vw, 34px);
  display: flex; flex-direction: column; align-items: center; gap: 24px;
}
.aura {
  position: absolute; left: -15%; right: -15%; top: -30%; height: 85%; z-index: -1; pointer-events: none;
  filter: blur(36px);
  -webkit-mask-image: linear-gradient(#000 35%, transparent);
  mask-image: linear-gradient(#000 35%, transparent);
  background:
    radial-gradient(28% 50% at var(--x1) var(--y1), rgba(var(--c1), var(--a)), transparent 70%),
    radial-gradient(24% 44% at var(--x2) var(--y2), rgba(var(--c2), calc(var(--a) * .85)), transparent 70%),
    radial-gradient(40% 46% at var(--x3) 22%, rgba(var(--c1), calc(var(--a) * .55)), transparent 72%);
}
.case::after {
  content: ""; position: absolute; left: 10%; right: 10%; top: 0; height: 1px; z-index: -1;
  background: linear-gradient(90deg, transparent, rgba(var(--c1), calc(var(--a) * 3)), transparent);
}

/* search */
.search { position: relative; width: min(560px, 100%); z-index: 5; }
.search label { position: absolute; left: -9999px; }
.search input {
  width: 100%; border: 1px solid var(--hair); outline: none; border-radius: 999px;
  background: rgba(0, 0, 0, .5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--text); font: 400 17px/1 var(--font-text); text-align: center; padding: 17px 64px;
  transition: border-color .2s;
}
.search input::placeholder { color: var(--faint); }
.search input:focus-visible { border-color: rgba(var(--c1), .55); outline: none; }
.search input::-webkit-search-cancel-button { display: none; }
.shuffle {
  position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
  color: var(--faint); display: grid; place-items: center; transition: color .2s, background .2s;
}
.shuffle:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
.shuffle svg { width: 19px; height: 19px; }
.go {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  width: 42px; height: 42px; padding: 0; justify-content: center; border-radius: 50%; border: 0; cursor: pointer;
  background: transparent; color: var(--muted); display: inline-flex; align-items: center; gap: 8px;
  box-shadow: inset 0 0 0 1px var(--hair);
  font: 500 14px/1 var(--font-text); transition: background .25s, color .25s, box-shadow .25s, transform .15s;
}
.go:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
.search.ready .go { color: var(--text); background: rgba(var(--c1), .12); box-shadow: inset 0 0 0 1px rgba(var(--c1), .45); }
.search.ready .go:hover { background: rgba(var(--c1), .2); }
.go:active { transform: translateY(-50%) scale(.97); }
.go svg { width: 18px; height: 18px; }
.go:focus-visible { outline: 2px solid rgba(var(--c1), .9); outline-offset: 3px; }
.shuffle.rolling svg { animation: roll .6s cubic-bezier(.3, .7, .3, 1); }
@keyframes roll { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(200deg) scale(.8); } 100% { transform: rotate(360deg) scale(1); } }
.recent {
  position: absolute; left: 0; right: 0; top: calc(100% + 8px);
  background: rgba(14, 14, 14, .96); border: 1px solid var(--hair); border-radius: 18px;
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .8);
}
.recent small { font: 400 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding-left: 4px; }
.recent div { display: flex; flex-wrap: wrap; gap: 6px; }
.recent button { border: 1px solid var(--hair); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font: 400 16px/1 var(--font-word); }
.recent button:hover { background: rgba(255, 255, 255, .06); }

/* the exhibit: drag it sideways to travel too */
.exhibit {
  display: grid; place-items: center; width: 100%; height: clamp(84px, 15vw, 118px);
  --box: min(100vw - 32px, 800px);
  touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none;
}
.exhibit.dragging { cursor: grabbing; }
.exhibit span {
  grid-area: 1 / 1; white-space: nowrap; line-height: 1;
  font: 400 min(5.4rem, calc(var(--box) / (var(--len, 5) * 0.5 + 1.6))) / 1 var(--font-word);
  letter-spacing: -0.01em; color: var(--word, #fff);
  will-change: opacity, filter, transform;
}
.exhibit .ast { color: rgb(var(--c1)); margin-right: .04em; }
.exhibit.pending span { animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .25; } 50% { opacity: .6; } }

/* placard */
.placard { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; min-height: 62px; }
.placard .lang { font: 500 14px/1.2 var(--font-text); }
.placard .era { font: 400 12px/1.2 var(--font-mono); color: var(--muted); letter-spacing: .03em; }
.placard .note { font: 400 15px/1.5 var(--font-text); color: var(--muted); max-width: 54ch; }
.placard .acc { font: 400 10.5px/1 var(--font-mono); color: var(--faint); letter-spacing: .1em; text-transform: uppercase; margin-top: 2px; }

/* ---------- the timeline ---------- */
.travel { width: min(580px, 100%); display: flex; flex-direction: column; gap: 4px; }
.hint {
  align-self: center; display: flex; align-items: center; gap: 8px;
  font: 400 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  transition: opacity .4s;
}
.hint svg { width: 16px; height: 10px; animation: nudge 1.6s ease-in-out infinite; }
.hint.gone { opacity: 0; pointer-events: none; }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-5px); } }
.timeline {
  position: relative; width: 100%; height: 62px;
  touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; outline: none;
}
.timeline.dragging { cursor: grabbing; }
.timeline .line { position: absolute; left: 14px; right: 14px; top: 22px; height: 1px; background: var(--hair); }
.timeline .trail { position: absolute; left: 0; top: 0; height: 1px; width: 0; background: linear-gradient(90deg, rgba(var(--c1), .1), rgba(var(--c1), .85)); }
.timeline .marks { position: absolute; left: 14px; right: 14px; top: 18px; height: 40px; pointer-events: none; }
.mark { position: absolute; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mark i { width: 1px; height: 9px; background: var(--faint); display: block; }
.mark b { font: 400 10.5px/1 var(--font-mono); letter-spacing: .08em; color: var(--faint); white-space: nowrap; transition: color .25s; font-weight: 400; }
.mark.on b { color: var(--text); }
.thumb {
  position: absolute; top: 13px; left: 14px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
  background: #fff; pointer-events: none;
  box-shadow: 0 0 0 5px rgba(var(--c1), .14), 0 0 24px 3px rgba(var(--c1), .5);
  transition: transform .25s cubic-bezier(.2, .8, .2, 1);
}
.timeline.dragging .thumb { transform: scale(1.3); }
.timeline.invite .thumb { animation: invite 1.6s ease-in-out infinite; }
@keyframes invite { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-9px); } }
.timeline:focus-visible .thumb { box-shadow: 0 0 0 5px rgba(var(--c1), .3), 0 0 0 7px rgba(var(--c1), .75); }
.ends { display: flex; justify-content: space-between; margin-top: -8px; padding: 0 2px; font: 400 10.5px/1 var(--font-mono); color: var(--faint); letter-spacing: .1em; text-transform: uppercase; }

/* ---------- the plaque ---------- */
.plaque {
  position: relative; width: 100%; max-width: 580px; border-radius: 16px;
  padding: 22px clamp(18px, 4vw, 30px) 18px;
  background: linear-gradient(155deg, #161616 0%, #0c0c0c 55%, #0a0a0a 100%);
  box-shadow:
    12px 14px 28px rgba(0, 0, 0, .95),
    -7px -7px 18px rgba(255, 255, 255, .04),
    inset 0 1px 0 rgba(255, 255, 255, .08),
    inset 0 -1px 0 rgba(0, 0, 0, .7);
  display: flex; flex-direction: column; gap: 12px;
}
.plaque .screw { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #3a3a3a, #121212 70%); box-shadow: 0 1px 0 rgba(255, 255, 255, .06); }
.plaque .screw:nth-child(1) { top: 10px; left: 10px; } .plaque .screw:nth-child(2) { top: 10px; right: 10px; }
.plaque .screw:nth-child(3) { bottom: 10px; left: 10px; } .plaque .screw:nth-child(4) { bottom: 10px; right: 10px; }
.engraved { font: 500 10.5px/1 var(--font-mono); letter-spacing: .2em; text-transform: uppercase; color: #4b4843; text-shadow: 0 1px 0 rgba(255, 255, 255, .07), 0 -1px 0 rgba(0, 0, 0, .9); text-align: center; }
.plaque p { margin: 0; color: #c9c5be; font: 400 15px/1.65 var(--font-text); text-align: center; }
.plaque p.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.plaque .kin { font-size: 13.5px; color: var(--muted); }
.plaque .kin span { color: #d8d4cd; }
.plaque .row { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
.press {
  border: 0; cursor: pointer; border-radius: 999px; padding: 8px 16px;
  background: linear-gradient(155deg, #171717, #0d0d0d); color: var(--muted);
  font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase;
  box-shadow: 4px 5px 10px rgba(0, 0, 0, .9), -3px -3px 8px rgba(255, 255, 255, .035), inset 0 1px 0 rgba(255, 255, 255, .07);
  transition: box-shadow .15s, color .15s;
}
.press:hover { color: var(--text); }
.press:active, .press[aria-expanded="true"] { box-shadow: inset 3px 3px 7px rgba(0, 0, 0, .9), inset -2px -2px 6px rgba(255, 255, 255, .04); color: var(--text); }
.credit { font: 400 10.5px/1.4 var(--font-mono); color: var(--faint); letter-spacing: .04em; text-align: center; }
.credit a { color: var(--faint); text-underline-offset: 3px; }
.credit a:hover { color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--hair); background: rgba(255, 255, 255, .03); cursor: pointer; border-radius: 999px;
  padding: 11px 20px; font: 500 13.5px/1 var(--font-text); color: var(--text);
  transition: background .2s, border-color .2s;
}
.btn svg { width: 14px; height: 14px; }
.btn:hover { background: rgba(255, 255, 255, .07); }
.btn.on { border-color: rgba(var(--c1), .5); background: rgba(var(--c1), .08); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.status { margin: 0; text-align: center; color: var(--muted); font: 400 16px/1.55 var(--font-text); max-width: 44ch; }

/* ---------- while the archive is searched ---------- */
.dig { width: min(440px, 100%); display: flex; flex-direction: column; align-items: center; gap: 16px; }
.progress { position: relative; width: 140px; height: 1px; background: var(--hair); overflow: hidden; }
.progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%; background: linear-gradient(90deg, transparent, rgba(var(--c1), .9), transparent); animation: sweep 1.2s ease-in-out infinite; }
@keyframes sweep { to { left: 100%; } }
.dig .q { font: 400 15px/1.5 var(--font-text); color: var(--muted); text-align: center; }
.dig .q strong { color: var(--text); font-weight: 500; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.choice { border: 1px solid var(--hair); background: transparent; border-radius: 999px; padding: 8px 15px; cursor: pointer; font: 400 13.5px/1 var(--font-text); color: var(--text); transition: background .2s, border-color .2s; }
.choice:hover { background: rgba(255, 255, 255, .06); }
.choice[aria-pressed="true"] { border-color: rgba(var(--c1), .7); background: rgba(var(--c1), .1); }
.choice:disabled { cursor: default; }
.verdict { font: 500 15px/1.4 var(--font-text); min-height: 1.4em; text-align: center; }
.verdict small { display: block; font: 400 12px var(--font-mono); color: var(--muted); letter-spacing: .04em; margin-top: 4px; }

.tiles { display: flex; gap: 8px; }
.tiles span { width: 46px; height: 46px; border: 1px solid var(--hair); border-radius: 10px; background: rgba(255, 255, 255, .02); }

/* ---------- collection drawer ---------- */
.collection { width: 100%; max-width: 800px; margin-top: 22px; }
.drawer {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: none; border: 0; border-bottom: 1px solid var(--hair); padding: 14px 6px; cursor: pointer;
  font: 400 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.drawer:hover { color: var(--text); }
.drawer .count { color: var(--text); margin-left: 8px; }
.drawer svg { width: 12px; height: 12px; transition: transform .25s; }
.drawer[aria-expanded="true"] svg { transform: rotate(180deg); }
.shelf { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 6px 4px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--hair); border-radius: 999px; }
.chip button { background: none; border: 0; cursor: pointer; }
.chip .open { font: 400 18px/1 var(--font-word); padding: 8px 4px 8px 16px; }
.chip .x { color: var(--faint); padding: 8px 12px 8px 6px; }
.chip .x:hover { color: var(--text); }
.empty { color: var(--faint); font-size: 13.5px; }

.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px);
  background: #111; border: 1px solid var(--hair); color: var(--text); padding: 9px 18px; border-radius: 999px;
  font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 440px) { .search input { padding-right: 52px; padding-left: 50px; font-size: 15px; } }
@media (max-width: 520px) { .mark b { font-size: 9px; letter-spacing: .04em; } .tiles span { width: 40px; height: 40px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<a class="mast" href="#" id="home" aria-label="etyms, a museum of words">
  <span class="mark-e" aria-hidden="true"><span>e</span></span>
  <span class="words"><b>etyms</b><small>a museum of words</small></span>
</a>

<main class="case" id="case">
  <div class="aura" aria-hidden="true"></div>
  <form class="search" id="searchForm" autocomplete="off">
    <label for="q">Find a word</label>
    <input id="q" type="search" placeholder="write a word, or “wordle”" spellcheck="false" autocapitalize="off" enterkeyhint="search">
    <button class="shuffle" id="shuffle" type="button" aria-label="Let the curator pick a word" title="Let the curator pick">

  const paintings = new Map();

  async function fromChicago(q) {
    const params = {
      q,
      query: { bool: { filter: [
        { term: { is_public_domain: true } },
        { range: { date_start: { gte: 1400, lte: 1650 } } },
        { exists: { field: "image_id" } }
      ] } },
      fields: ["id", "title", "artist_title", "artist_display", "date_display", "image_id", "thumbnail", "classification_title"],
      limit: 12
    };
    const r = await fetch(`https://api.artic.edu/api/v1/artworks/search?params=${encodeURIComponent(JSON.stringify(params))}`);
    if (!r.ok) return null;
    const j = await r.json();
    const iiif = j?.config?.iiif_url || "https://www.artic.edu/iiif/2";
    const list = (j.data || []).filter(d => d.image_id);
    const hit = list.find(d => /paint/i.test(d.classification_title || "")) || list[0];

        const o = await (await fetch(`${base}/objects/${id}`)).json();

    return null;
  }

    const key = q.toLowerCase();

  // The feather, barb by barb, in quill coordinates (nib at 0,0, feather along +x, gently curved).
  function quillBarbs() {
    let rnd = 11;
    const rand = () => { rnd = (rnd * 16807) % 2147483647; return rnd / 2147483647; };
    const yc = (x) => -16 * Math.pow(Math.max(0, x - 40) / 280, 2);        // the rachis bends as feathers do

      up += ` L${(x + w * 0.72).toFixed(1)} ${(yc(x) - w - 1).toFixed(1)}`;
    }
    up += ` L314 ${yc(314).toFixed(1)} Z`;
    for (let x = 72; x <= 314; x += 2) {

      low += ` L${(x + w * 0.72).toFixed(1)} ${(yc(x) + w + 1).toFixed(1)}`;
    }
    low += ` L314 ${yc(314).toFixed(1)} Z`;
    let dark = "", light = "", band = "";

      const y0 = yc(x);
      const mU = near(notchU, x) ? 0.42 : 0.84 + rand() * 0.18, mL = near(notchL, x) ? 0.4 : 0.84 + rand() * 0.18;

    for (let i = 0; i < 12; i++) {
      const x = 50 + rand() * 24, side = rand() < 0.5 ? -1 : 1, len = 7 + rand() * 14;
      fluff += `M${x.toFixed(1)} ${(yc(x) + side).toFixed(1)} q${(len * 0.25).toFixed(1)} ${(side * len * (0.6 + rand() * 0.6)).toFixed(1)} ${(len * (0.6 + rand() * 0.5)).toFixed(1)} ${(side * len * (0.3 + rand() * 0.6)).toFixed(1)} `;

    rachis += " Z";
    return { up, low, dark, light, band, fluff, rachis };
  }

  const smoother = (x) => x * x * x * (x * (x * 6 - 15) + 10);

    const s = smoother(f);

  async function downloadCard(entry) {

    const rgb = (a, al = 1) => `rgba(${a[0]}, ${a[1]}, ${a[2]}, ${al})`;
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    // the light: sepia on the left drifting into daylight on the right

      rg.addColorStop(0, rgb(sample(LIGHT, t), 0.3)); rg.addColorStop(1, rgb(sample(LIGHT, t), 0));

    }
    g.textAlign = "center"; g.textBaseline = "alphabetic";
    g.fillStyle = "#9a968f"; g.font = `22px ${mono}`;
    g.fillText("etyms · a journey", W / 2, 96);
    let size = 170;
    g.font = `${size}px ${serif}`;
    while (g.measureText(entry.title).width > 900 && size > 60) { size -= 6; g.font = `${size}px ${serif}`; }
    g.fillStyle = "#fff"; g.fillText(entry.title, W / 2, 300);
    g.fillStyle = "#9a968f"; g.font = `24px ${mono}`;
    g.fillText([entry.ipa, entry.pos].filter(Boolean).join("  ·  ") || "Modern English", W / 2, 360);

    const st = entry.stages, n = st.length;
    const top = 450, bottom = H - 170, step = n > 1 ? Math.min(150, (bottom - top) / (n - 1)) : 0;
    const termSize = step < 110 ? 40 : 52;
    const x0 = 150;
    g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x0, top); g.lineTo(x0, top + step * (n - 1)); g.stroke();
    st.forEach((s, i) => {
      const y = top + step * i, t = n > 1 ? i / (n - 1) : 1, isNow = i === n - 1;
      g.fillStyle = rgb(sample(LIGHT, t)); g.beginPath(); g.arc(x0, y, isNow ? 11 : 8, 0, Math.PI * 2); g.fill();
      g.textAlign = "left";
      g.fillStyle = "#7d7973"; g.font = `22px ${mono}`;
      g.fillText((isNow ? "MODERN ENGLISH" : s.lang.toUpperCase()), x0 + 44, y - 12);
      g.textAlign = "right";
      g.fillText(isNow ? "TODAY" : (s.era || "").toUpperCase(), W - 110, y - 12);
      g.textAlign = "left";
      let ts = termSize; g.font = `${ts}px ${serif}`;

    g.textAlign = "left"; g.fillStyle = "#8b8780"; g.font = `25px ${mono}`;
    g.fillText("etyms, made by abhiggt.", 96, H - 74);
    g.textAlign = "right"; g.fillStyle = "#5d5a55"; g.font = `22px ${mono}`;

  /* ======================= while the archive is searched: guess the origin ======================= */
  const FAMILIES = ["Germanic", "Latin", "Greek", "French", "Somewhere else"];
  function origins(entry) {

    for (const s of entry.stages.slice(0, -1)) {
      const l = s.lang;
      if (/Latin|Italic/.test(l)) add("Latin");
      else if (/Greek|Hellenic/.test(l)) add("Greek");
      else if (/French|Norman|Occitan/.test(l)) add("French");
      else if (/Old English|Germanic|Norse|Saxon|Frisian|Dutch|German/.test(l)) add("Germanic");

        const today = ymd(new Date());

  /* ======================= wiring ======================= */
  const q = $("q");
  $("searchForm").addEventListener("submit", (e) => { e.preventDefault(); search(q.value); q.blur(); });
  let typeTimer, paintTimer;
  const syncReady = () => $("searchForm").classList.toggle("ready", q.value.trim().length > 0);
  q.addEventListener("input", () => {
    syncReady();
    clearTimeout(typeTimer); clearTimeout(paintTimer);
    const v = q.value.trim();
    // in the foyer, the painting follows what's being written
    if (foyerEls?.frame.isConnected) paintTimer = setTimeout(() => { if (v.length >= 3) hangPainting(v); else { ++foyerToken; hangDesk(); } }, 650);
    if (v.length < 3 || v.toLowerCase() === "wordle") return;
    typeTimer = setTimeout(() => lookup(v).catch(() => {}), 400);
  });
  // the placeholder suggests a word worth trying, a new one every few seconds
  const EXAMPLES = ["salary", "nightmare", "quarantine", "wordle", "muscle", "companion", "disaster", "silly"];
  let ex = 0;
  setInterval(() => {
    if (q.value) return;
    ex = (ex + 1) % EXAMPLES.length;
    q.placeholder = `write a word, try “${EXAMPLES[ex]}”`;
  }, 3200);
  q.placeholder = `write a word, try “${EXAMPLES[0]}”`;
  // tapping the papyrus is a quiet way in: it picks a word for you
  stage.addEventListener("click", (e) => { if (e.target.closest(".frame svg")) $("shuffle").click(); });

  $("shuffle").addEventListener("click", () => {
    const d = $("shuffle");
    d.classList.remove("rolling"); void d.offsetWidth; d.classList.add("rolling");
    const pool = SURPRISE.filter(w => w !== current?.title);
    const w = pool[Math.floor(Math.random() * pool.length)];
    q.value = w; syncReady();
    setTimeout(() => search(w), reduceMotion ? 0 : 450);
  });
  $("home").addEventListener("click", (e) => {
    e.preventDefault(); ++token; q.value = "";
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    document.title = "etyms";
    showFoyer();
  });
  document.addEventListener("keydown", (e) => {
    const a = document.activeElement;
    const typing = a?.tagName === "INPUT";
    if (e.key === "/" && !typing) { e.preventDefault(); q.focus(); q.select(); return; }
    if (typing || !current || e.metaKey || e.ctrlKey || e.altKey || a === ui.line) return;
    const r = Math.round(mode === "spring" ? target : pos);
    if (e.key === "ArrowLeft") { e.preventDefault(); dismissHint(); springTo(r - 1, 150); }
    if (e.key === "ArrowRight") { e.preventDefault(); dismissHint(); springTo(r + 1, 150); }
  });
  addEventListener("hashchange", () => {
    const w = decodeURIComponent(location.hash.slice(1));
    if (w && (!current || current.title !== w)) { q.value = w; search(w); }
  });

  renderShelf();
  setDrawer(store.get(DRAWER, false));
  tint(1);
  requestAnimationFrame(frame);
  // Visitors arrive in the foyer. A shared link (#word) takes them straight to that exhibit.
  const start = txt(decodeURIComponent(location.hash.slice(1)));
  if (start) { q.value = start; syncReady(); search(start); }
  else {
    showFoyer();
    if (matchMedia("(pointer: fine)").matches) q.focus({ preventScroll: true });   // desktop: ready to type
  }
})();
</script>
</body>
